name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nx run-many -t build

      - name: Lint
        run: npx nx run-many -t lint

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Unit Tests
        run: npx nx run-many -t test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-lint-test

    services:
      kurrentdb:
        image: eventstore/eventstore:24.10
        env:
          EVENTSTORE_CLUSTER_SIZE: 1
          EVENTSTORE_RUN_PROJECTIONS: All
          EVENTSTORE_START_STANDARD_PROJECTIONS: true
          EVENTSTORE_INSECURE: true
          EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: true
        ports:
          - 2113:2113
        options: >-
          --health-cmd "curl -sf http://localhost:2113/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: npx nx build event-store-core

      - name: Wait for KurrentDB
        run: |
          echo "Waiting for KurrentDB to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:2113/health/live; do sleep 2; done'
          echo "KurrentDB is ready"

      - name: Run Integration Tests
        run: npx nx integration-test @pbuda/event-store-kurrentdb
